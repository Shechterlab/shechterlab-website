hugoblox:
  schema: "2.0"
  identity:
    name: "Shechter Lab"
    organization: "Shechter Lab at Albert Einstein College of Medicine"
    type: organization
    tagline: "Chromatin, RNA processing, and therapeutic targeting"
    description: "The Shechter Lab at Einstein decodes how protein modifications regulate gene expression and RNA processing in cancer and ALS."
    social:
      twitter: ""

  theme:
    mode: light
    pack: "default"
    colors:
      primary: "#155e75"
      secondary: "#c2410c"
      neutral: ""
    colors_light: {}
    colors_dark: {}
    surfaces:
      background: ""
      foreground: ""
      header:
        background: ""
        foreground: ""
      footer:
        background: ""
        foreground: ""

  # NOTE: the theme's font-pack system below is superseded by hardcoded
  # font declarations in assets/css/custom.css (IBM Plex Serif headings,
  # Inter body). `pack:` is set to a valid value for correctness/fallback,
  # but changing it will not visibly change the site's fonts — edit
  # custom.css instead.
  typography:
    pack: "modern"
    size: "md"

  layout:
    radius: "md"
    spacing: "comfortable"
    avatar_shape: circle

  header:
    enable: true
    style: navbar
    sticky: true
    align: center
    search: false
    theme_toggle: true
    theme_picker: false
    language_switcher: false
    cta:
      enable: true
      text: "Contact"
      url: "/contact"

  footer:
    style: minimal
    language_switcher: false
    text: "[Department of Biochemistry](https://einsteinmed.edu/departments/biochemistry), [Albert Einstein College of Medicine](https://einsteinmed.edu)"

  copyright:
    notice: "© {year} {name}."
    license:
      type: custom
      allow_derivatives: false
      share_alike: false
      allow_commercial: false

  seo:
    title: "Shechter Lab"
    location:
      address:
        street: "1300 Morris Park Avenue"
        city: "Bronx"
        region: "NY"
        postal_code: "10461"
        country: "United States"
      coordinates:
        latitude: null
        longitude: null
      phone: "+1-718-430-4120"
    ai:
      allow:
        - /
      disallow: []
      note: "Public research-lab website."
      contact: "david.shechter@einsteinmed.edu"

  content:
    math:
      enable: false
    toc:
      enable: true
    reading_time:
      enable: true
    citations:
      style: apa

  search:
    enable: true
    suggestions: ["PRMT5", "TTLL4", "glutamylation", "AML", "chromatin"]
    quick_actions: []

  comments:
    enable: false
    provider: ""
    giscus:
      repo: ""
      repo_id: ""
      category: ""
      category_id: ""
    disqus:
      shortname: ""

  analytics:
    google:
      measurement_id: ""
    google_tag_manager:
      container_id: ""
    plausible:
      domain: ""
    fathom:
      site_id: ""
    pirsch:
      site_id: ""
    clarity:
      project_id: ""
    baidu:
      site_id: ""

  verification:
    google: ""
    bing: ""
    baidu: ""
    yandex: ""
    pinterest: ""
    naver: ""

  repository:
    enable: false
    url: ""
    branch: main
    content_dir: content

  locale:
    date_format: "Jan 2, 2006"
    time_format: "3:04 PM"
    address_format: en-us

  security:
    csp:
      policy: ""
      report_only: false
    frame_options: allow
    permissions_policy: ""
