hugoblox:
  schema: "2.0"
  identity:
    name: "Shechter Lab"
    organization: "Shechter Lab at Albert Einstein College of Medicine"
    type: organization
    tagline: "Chromatin, RNA processing, and therapeutic targeting"
    description: "The Shechter Lab at Einstein decodes how protein modifications regulate gene expression and RNA processing in cancer and ALS."
    social:
      twitter: ""

  theme:
    mode: light
    pack: "default"
    colors:
      primary: "#155e75"
      secondary: "#c2410c"
      neutral: ""
    colors_light: {}
    colors_dark: {}
    surfaces:
      background: ""
      foreground: ""
      header:
        background: ""
        foreground: ""
      footer:
        background: ""
        foreground: ""

  # NOTE: the theme's font-pack system below is superseded by hardcoded
  # font declarations in assets/css/custom.css (IBM Plex Serif headings,
  # Inter body). `pack:` is set to a valid value for correctness/fallback,
  # but changing it will not visibly change the site's fonts — edit
  # custom.css instead.
  typography:
    pack: "modern"
    size: "md"

  layout:
    radius: "md"
    spacing: "comfortable"
    avatar_shape: circle

  header:
    enable: true
    style: navbar
    sticky: true
    align: center
    search: false
    theme_toggle: true
    theme_picker: false
    language_switcher: false
    cta:
      enable: true
      text: "Contact"
      url: "/contact#inquiry"

  footer:
    style: minimal
    language_switcher: false
    text: "[Department of Biochemistry](https://einsteinmed.edu/departments/biochemistry), [Albert Einstein College of Medicine](https://einsteinmed.edu)"

  copyright:
    notice: "© {year} {name}."
    license:
      type: custom
      allow_derivatives: false
      share_alike: false
      allow_commercial: false

  seo:
    title: "Shechter Lab"
    location:
      address:
        street: "1300 Morris Park Avenue"
        city: "Bronx"
        region: "NY"
        postal_code: "10461"
        country: "United States"
      coordinates:
        latitude: null
        longitude: null
    ai:
      allow:
        - /
      disallow: []
      note: "Public research-lab website."
      contact: "https://www.shechterlab.org/contact/"

  content:
    math:
      enable: false
    toc:
      enable: true
    reading_time:
      enable: true
    citations:
      style: apa

  search:
    enable: true
    suggestions: ["PRMT5", "TTLL4", "glutamylation", "AML", "chromatin"]
    quick_actions: []

  comments:
    enable: false
    provider: ""
    giscus:
      repo: ""
      repo_id: ""
      category: ""
      category_id: ""
    disqus:
      shortname: ""

  # The theme injects the gtag snippet into <head> on every page via
  # blox-analytics (site_head.html), so there is no script tag pasted
  # into any template — set the key here and the theme does the rest.
  # It also anonymises IPs and tracks outbound link clicks.
  #
  # The snippet is emitted whenever hugo.IsProduction is true. Note
  # that a plain `hugo` build IS production by default, so Netlify
  # DEPLOY PREVIEWS report hits too; only `hugo server` (development)
  # is excluded. If preview traffic ever muddies the numbers, filter it
  # out in GA by hostname — the previews serve from *.netlify.app,
  # the real site from www.shechterlab.org.
  analytics:
    google:
      measurement_id: "G-PZEFBPYHJE"
    google_tag_manager:
      container_id: ""
    plausible:
      domain: ""
    fathom:
      site_id: ""
    pirsch:
      site_id: ""
    clarity:
      project_id: ""
    baidu:
      site_id: ""

  verification:
    google: ""
    bing: ""
    baidu: ""
    yandex: ""
    pinterest: ""
    naver: ""

  repository:
    enable: false
    url: ""
    branch: main
    content_dir: content

  locale:
    date_format: "Jan 2, 2006"
    time_format: "3:04 PM"
    address_format: en-us

  # Rendered into the Netlify _headers file by layouts/index.headers.
  # NOTE: the vendored generator had a whitespace bug that made the
  # generated file set no headers at all; layouts/index.headers is a
  # local override that fixes it. See the comment at the top of that file.
  security:
    csp:
      # 'unsafe-inline' is unavoidable here: the theme and several pages
      # use inline <style> and <script> (the homepage stat counter, the
      # lightbox styles, the card grids), and a static build has no way
      # to nonce them. The remaining directives still do real work —
      # frame-ancestors, form-action, base-uri and object-src close off
      # clickjacking, form hijacking and plugin injection.
      #
      # External origins allowed, and why:
      #   fonts.googleapis.com / fonts.gstatic.com — the webfont @import
      #     in assets/css/custom.css
      #   cdn.rcsb.org, www.ebi.ac.uk — structure and EM-map thumbnails
      #     on the Resources page
      #   'wasm-unsafe-eval' — Pagefind's search index is WebAssembly
      #
      #   googletagmanager.com / google-analytics.com — Google Analytics
      #     (hugoblox.analytics.google above). Adding another analytics
      #     or embed service means adding its origin here too, or it
      #     will be blocked with nothing but a console message to say
      #     so. Set report_only: true to watch for violations without
      #     anything actually being blocked.
      #
      # Keep every directive on ONE line at this exact indentation. In a
      # YAML folded scalar (>-) a line indented deeper than the first is
      # kept verbatim, newline and all — and a newline inside an HTTP
      # header value truncates the header.
      policy: >-
        default-src 'self';
        base-uri 'self';
        form-action 'self';
        frame-ancestors 'none';
        object-src 'none';
        img-src 'self' data: https://cdn.rcsb.org https://www.ebi.ac.uk https://www.google-analytics.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://www.googletagmanager.com;
        connect-src 'self' https://www.google-analytics.com https://*.analytics.google.com https://*.google-analytics.com https://*.googletagmanager.com;
        manifest-src 'self'
      report_only: false
    # No page on this site is meant to be framed anywhere.
    frame_options: deny
    permissions_policy: ""
