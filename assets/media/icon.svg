<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Site icon: an S monogram in the site's own colours — teal (#155e75)
    with the orange of the link accent (#f97316).

    It replaced a drawn nucleosome, DNA wrapping a histone core: accurate
    to what the lab studies and completely illegible at 16px, which is
    where a favicon actually lives. A letterform survives the shrink; a
    picture of a nucleosome turns into a smudge.

    The S is a stroked path rather than text, so it does not depend on a
    font being present wherever this is rendered. assets/media/icon.png is
    a 512px render of this same file — regenerate the two together.
  -->
  <rect width="32" height="32" rx="7" fill="#155e75"/>
  <path d="M20.5,11.3 C20.5,8.2 11.5,7.8 11.5,12.4 C11.5,16 20.5,16 20.5,19.6 C20.5,24.2 11.5,23.8 11.5,20.7"
        fill="none" stroke="#f97316" stroke-width="3.6" stroke-linecap="round"/>
</svg>
