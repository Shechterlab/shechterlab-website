# Sponsors of the NYC Chromatin Club symposium.
#
# HOW TO EDIT
#   Add a block under `years` for each symposium. The most recent year
#   that actually HAS sponsors leads /sponsors/ and the home-page strip;
#   the rest fall into "Sponsors over the years", newest first. That is
#   derived, so filling in 2027 promotes it automatically — there is no
#   flag to remember to move.
#
#   A sponsor needs only a `name`. `url` and `tier` are optional, and
#   `logo` is optional too — a sponsor with no logo renders as a
#   typographic card, which is deliberate: it means the page never waits
#   on chasing a vector file, and it keeps the grid tidy when half the
#   sponsors have sent artwork and half have not.
#
#   Logos go in assets/media/sponsors/ and are referenced relative to
#   that directory, e.g. `logo: sponsors/acme.svg`. Use the sponsor's own
#   supplied artwork; do not scrape a logo off their website.
#
# TIERS
#   Rename or re-order these freely — the page renders whatever is here,
#   in this order, and silently skips a tier with no sponsors in it.

tiers:
  - id: lead
    name: Lead sponsors
    blurb: Underwrite the venue and catering for the whole day.
  - id: supporting
    name: Supporting sponsors
    blurb: Cover the poster session and trainee travel.
  - id: exhibitor
    name: Exhibitors
    blurb: Host a table alongside the poster session.

years:
  - year: 2027
    sponsors: []

  - year: 2026
    sponsors:
      - name: Dovetail Genomics
        blurb: Part of Cantata Bio, LLC
        url: https://cantatabio.com/
        logo: sponsors/dovetail-genomics.png
      - name: Hologic Diagenode
        url: https://www.diagenode.com/
        logo: sponsors/hologic-diagenode.png
      - name: 10x Genomics
        url: https://www.10xgenomics.com/
        logo: sponsors/10x-genomics.png
      - name: EpiCypher
        url: https://www.epicypher.com/
        logo: sponsors/epicypher.png

  - year: 2025
    sponsors: []

  - year: 2024
    sponsors: []

# ---------------------------------------------------------------------
# The 2026 list above is taken from the official symposium program
# ("NYCCC organizers would like to thank symposium sponsors for their
# valuable contributions and support"), and the logos in
# assets/media/sponsors/ are extracted from that same PDF, so they are the
# artwork each company supplied.
#
# TODO (organizers): 2024, 2025 and 2027 are still empty. No tiers are
# assigned for 2026 either — the program lists sponsors as one group. If
# the club starts selling tiers, add `tier: lead` etc. and they will group
# automatically; without a tier they render under one heading.
# ---------------------------------------------------------------------
